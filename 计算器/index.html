<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>计算器</title>
<style>
:root{
  --bg:#eef1f7;
  --shell:#ffffff;
  --panel:#f7f8fc;
  --text:#1b202b;
  --muted:#78829a;
  --line:#e3e7f0;
  --brand:#4c6ef5;
  --brand-soft:rgba(76,110,245,.12);
  --fn:#f0f2f8;
  --op:#e8edff;
  --op-ink:#3b5bdb;
  --eq:#4c6ef5;
  --danger:#e5484d;
  --ok:#10b981;
  --shadow:0 10px 30px rgba(20,28,55,.10);
  --shadow-lg:0 20px 48px -12px rgba(20,28,55,.22);
  --radius:16px;
}
html[data-theme="dark"]{
  --bg:#0d1016;
  --shell:#151922;
  --panel:#1b202a;
  --text:#e7ebf4;
  --muted:#8e99b0;
  --line:#262c38;
  --brand:#6b8afd;
  --brand-soft:rgba(107,138,253,.16);
  --fn:#1f2530;
  --op:#232c44;
  --op-ink:#93aaff;
  --eq:#4c6ef5;
  --shadow:0 12px 34px rgba(0,0,0,.5);
  --shadow-lg:0 24px 56px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:
    radial-gradient(900px 480px at 12% -10%,color-mix(in srgb,var(--brand) 16%,transparent),transparent 62%),
    radial-gradient(780px 460px at 94% 6%,rgba(139,92,246,.14),transparent 62%),
    var(--bg);
  color:var(--text);
  font-family:"Segoe UI Variable","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  font-size:14.5px;-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;
  padding:26px 16px 44px;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit;color:inherit}
::selection{background:var(--brand-soft)}

.wrap{width:100%;max-width:760px}

/* 顶栏 */
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;
  background:linear-gradient(135deg,var(--brand),#8b5cf6);color:#fff;
  box-shadow:0 8px 20px -6px color-mix(in srgb,var(--brand) 70%,transparent)}
.top h1{margin:0;font-size:17px}
.top .sub{font-size:12px;color:var(--muted)}
.top .spacer{flex:1}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--shell);box-shadow:var(--shadow);transition:.16s}
.icon-btn:hover{transform:translateY(-1px);background:var(--panel)}
.toggle{display:flex;background:var(--shell);border:1px solid var(--line);border-radius:10px;
  overflow:hidden;box-shadow:var(--shadow)}
.toggle button{padding:7px 12px;font-size:12px;color:var(--muted);font-weight:600;transition:.16s}
.toggle button.on{background:var(--brand);color:#fff}

/* 主体 */
.card{background:var(--shell);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden}
.calc{display:grid;grid-template-columns:minmax(0,1fr) 232px}
@media (max-width:700px){.calc{grid-template-columns:1fr}}

/* 显示屏 */
.display{padding:16px 18px 12px;border-bottom:1px solid var(--line);background:var(--panel);position:relative}
.chips{display:flex;gap:6px;align-items:center;margin-bottom:8px;min-height:18px;flex-wrap:wrap}
.chip{font-size:10.5px;font-weight:700;letter-spacing:.5px;padding:2px 7px;border-radius:99px;
  border:1px solid var(--line);color:var(--muted);background:var(--shell)}
.chip.on{color:#fff;background:var(--brand);border-color:transparent}
.chip.mem.on{color:#fff;background:#f59e0b;border-color:transparent}
.chip.hint{border-style:dashed;font-weight:500;letter-spacing:0}
#expr{
  width:100%;border:none;outline:none;background:transparent;
  font-family:"Consolas","Cascadia Mono","SF Mono",Menlo,monospace;
  font-size:26px;line-height:1.35;padding:2px 0;text-align:right;
  min-height:38px;user-select:text;
}
#expr::placeholder{color:var(--muted);opacity:.6}
#result{
  text-align:right;font-family:"Consolas","Cascadia Mono",Menlo,monospace;
  font-size:17px;color:var(--muted);min-height:24px;margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:text;
}
#result.ok{color:var(--ok);font-weight:600}
#result.err{color:var(--danger);font-weight:600}

/* 键盘区 */
.pad{padding:14px 14px 16px;display:grid;gap:7px}
.row{display:grid;gap:7px}
.row.r5{grid-template-columns:repeat(5,1fr)}
.row.r4{grid-template-columns:repeat(4,1fr)}
.key{
  height:46px;border-radius:11px;background:var(--panel);border:1px solid var(--line);
  font-size:15px;font-weight:500;transition:transform .1s,background .16s,box-shadow .16s;
  display:grid;place-items:center;overflow:hidden;
}
.key:hover{background:var(--panel);box-shadow:var(--shadow);transform:translateY(-1px)}
.key:active{transform:translateY(0) scale(.97)}
.key.fn{background:var(--fn);color:var(--muted);font-size:13.5px}
.key.op{background:var(--op);color:var(--op-ink);font-weight:600;font-size:17px}
.key.eq{background:var(--eq);color:#fff;font-weight:700;font-size:18px}
.key.del{color:var(--danger);font-size:15px}
.key.wide{grid-column:span 2}
.key.on{background:var(--brand);color:#fff;border-color:transparent}
.key small{font-size:9.5px;opacity:.7;margin-left:2px}

/* 历史 */
.hist{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;
  max-height:620px}
@media (max-width:700px){
  .hist{border-left:none;border-top:1px solid var(--line);max-height:260px}
}
.hist-head{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line)}
.hist-head b{font-size:12.5px;flex:1}
.hist-head button{font-size:11.5px;color:var(--muted);padding:3px 8px;border-radius:7px;transition:.16s}
.hist-head button:hover{background:var(--line);color:var(--text)}
.hist-list{flex:1;overflow:auto;padding:6px}
.hist-item{padding:8px 10px;border-radius:9px;cursor:pointer;transition:.14s;margin-bottom:3px}
.hist-item:hover{background:var(--shell)}
.hist-item .e{font-family:"Consolas",Menlo,monospace;font-size:11.5px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-item .r{font-family:"Consolas",Menlo,monospace;font-size:15px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.hist-item .r.res{color:var(--muted)}
.empty{text-align:center;padding:26px 12px;color:var(--muted);font-size:12.5px}
.empty .big{font-size:26px;margin-bottom:6px;opacity:.8}

/* 提示条 */
.tips{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.85}
kbd{background:var(--shell);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
  padding:0 5px;font-size:11px;font-family:inherit}

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);
  background:var(--shell);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow-lg);
  padding:9px 16px;font-size:12.5px;opacity:0;pointer-events:none;transition:.22s;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="mark">🧮</div>
    <div>
      <h1>科学计算器</h1>
      <div class="sub" id="subTitle">支持表达式、历史记录与内存</div>
    </div>
    <span class="spacer"></span>
    <div class="toggle" id="angleToggle">
      <button data-ang="deg" class="on">DEG</button>
      <button data-ang="rad">RAD</button>
    </div>
    <button class="icon-btn" id="themeBtn" title="切换浅色 / 深色">🌙</button>
  </div>

  <div class="card">
    <div class="calc">

      <!-- 左：显示 + 键盘 -->
      <div>
        <div class="display">
          <div class="chips">
            <span class="chip mem" id="chipMem">M</span>
            <span class="chip" id="chipAngle">DEG</span>
            <span class="chip hint" id="chipAns">Ans = 0</span>
          </div>
          <input type="text" id="expr" placeholder="输入表达式…" spellcheck="false" autocomplete="off">
          <div id="result">0</div>
        </div>

        <div class="pad" id="pad">
          <div class="row r5">
            <button class="key fn" data-ins="" data-2nd="" data-act="2nd" id="btn2nd">2nd</button>
            <button class="key fn" data-ins="" data-2nd="" data-act="pi">π</button>
            <button class="key fn" data-ins="" data-2nd="" data-act="e">e</button>
            <button class="key fn" data-ins="" data-2nd="" data-act="rand">Rnd</button>
            <button class="key fn" data-ins="" data-2nd="" data-act="ans">Ans</button>
          </div>

          <div class="row r5">
            <button class="key fn" data-act="fn" data-fn="sin" data-fn2="asin">sin</button>
            <button class="key fn" data-act="fn" data-fn="cos" data-fn2="acos">cos</button>
            <button class="key fn" data-act="fn" data-fn="tan" data-fn2="atan">tan</button>
            <button class="key fn" data-act="fn" data-fn="log" data-fn2="pow10">log</button>
            <button class="key fn" data-act="fn" data-fn="ln"  data-fn2="exp">ln</button>
          </div>

          <div class="row r5">
            <button class="key fn" data-ins="(">(</button>
            <button class="key fn" data-ins=")">)</button>
            <button class="key fn" data-act="mem" data-mem="mc">MC</button>
            <button class="key fn" data-act="mem" data-mem="mr">MR</button>
            <button class="key fn" data-act="mem" data-mem="m+">M+</button>
          </div>

          <div class="row r4">
            <button class="key op" data-act="clr" data-clr="all">AC</button>
            <button class="key del" data-act="clr" data-clr="back">⌫</button>
            <button class="key fn" data-ins="%" title="取模">mod</button>
            <button class="key op" data-ins="÷">÷</button>
          </div>

          <div class="row r4">
            <button class="key" data-ins="7">7</button>
            <button class="key" data-ins="8">8</button>
            <button class="key" data-ins="9">9</button>
            <button class="key op" data-ins="×">×</button>
          </div>

          <div class="row r4">
            <button class="key" data-ins="4">4</button>
            <button class="key" data-ins="5">5</button>
            <button class="key" data-ins="6">6</button>
            <button class="key op" data-ins="−">−</button>
          </div>

          <div class="row r4">
            <button class="key" data-ins="1">1</button>
            <button class="key" data-ins="2">2</button>
            <button class="key" data-ins="3">3</button>
            <button class="key op" data-ins="+">+</button>
          </div>

          <div class="row r5">
            <button class="key fn" data-ins="" data-act="sign">±</button>
            <button class="key" data-ins="0">0</button>
            <button class="key" data-ins=".">.</button>
            <button class="key fn" data-act="fn" data-fn="sqrt" data-fn2="cbrt" title="平方根">√</button>
            <button class="key eq" data-act="eq">=</button>
          </div>

          <div class="row r5">
            <button class="key fn" data-ins="^">xʸ</button>
            <button class="key fn" data-ins="²">x²</button>
            <button class="key fn" data-ins="!">n!</button>
            <button class="key fn" data-ins="1/">&nbsp;1/x</button>
            <button class="key fn" data-act="mem" data-mem="m-">M−</button>
          </div>
        </div>
      </div>

      <!-- 右：历史 -->
      <div class="hist">
        <div class="hist-head">
          <b>历史记录</b>
          <button id="histClear">清空</button>
        </div>
        <div class="hist-list" id="histList"></div>
      </div>

    </div>
  </div>

  <div class="tips">
    <div><b>键盘</b>：直接输入算式，<kbd>Enter</kbd> 求值 · <kbd>Esc</kbd> 清空 · <kbd>Backspace</kbd> 退格 · <kbd>↑</kbd><kbd>↓</kbd> 翻历史</div>
    <div><b>支持的写法</b>：<code>2+3×4</code>、<code>sin(30)</code>、<code>log(100)</code>、<code>√9</code>、<code>2^10</code>、<code>5!</code>、<code>3²</code>、<code>1/2</code>、<code>π</code>、<code>e</code>、<code>Ans</code></div>
    <div><b>精度</b>：内部用十进制有效数字校正，避免 <code>0.1+0.2=0.30000000000000004</code> 这类浮点误差</div>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
'use strict';

/* ==================================================================
   常量
   ================================================================== */
var KEY = { hist: 'calc.history.v1', prefs: 'calc.prefs.v1' };
var MAX_HIST = 100;

function $(id) { return document.getElementById(id); }
function store(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch (e) { console.warn('写入失败', k, e); return false; }
}
function load(k, fb) {
  try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; }
  catch (e) { console.warn('读取失败', k, e); return fb; }
}
function toast(msg) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.classList.remove('on'); }, 1700);
}

/* ==================================================================
   表达式解析器（不使用 eval）
   文法：
     expr   := term (('+'|'-') term)*
     term   := unary (('×'|'÷'|'%') unary)*
     unary  := ('-'|'+') unary | power
     power  := postfix ('^' unary)?            // 右结合
     postfix:= primary ('²' | '³' | '!')*
     primary:= number | 常量 | 函数 '(' expr ')' | '(' expr ')'
   ================================================================== */

var FUNCS = {
  sin:   { arity: 1, fn: function (x) { return Math.sin(toRad(x)); } },
  cos:   { arity: 1, fn: function (x) { return Math.cos(toRad(x)); } },
  tan:   { arity: 1, fn: function (x) { return Math.tan(toRad(x)); } },
  asin:  { arity: 1, fn: function (x) { return fromRad(Math.asin(x)); } },
  acos:  { arity: 1, fn: function (x) { return fromRad(Math.acos(x)); } },
  atan:  { arity: 1, fn: function (x) { return fromRad(Math.atan(x)); } },
  sinh:  { arity: 1, fn: Math.sinh },
  cosh:  { arity: 1, fn: Math.cosh },
  tanh:  { arity: 1, fn: Math.tanh },
  log:   { arity: 1, fn: function (x) { return Math.log(x) / Math.LN10; } },
  ln:    { arity: 1, fn: Math.log },
  exp:   { arity: 1, fn: Math.exp },
  sqrt:  { arity: 1, fn: Math.sqrt },
  cbrt:  { arity: 1, fn: Math.cbrt },
  abs:   { arity: 1, fn: Math.abs },
  round: { arity: 1, fn: Math.round },
  floor: { arity: 1, fn: Math.floor },
  ceil:  { arity: 1, fn: Math.ceil },
  pow10: { arity: 1, fn: function (x) { return Math.pow(10, x); } }
};
var CONSTS = { 'π': Math.PI, 'pi': Math.PI, 'e': Math.E, 'tau': Math.PI * 2 };

var angleMode = 'deg';                     // deg | rad
function toRad(x) { return angleMode === 'deg' ? x * Math.PI / 180 : x; }
function fromRad(x) { return angleMode === 'deg' ? x * 180 / Math.PI : x; }
var ANS = 0;

/* ---------- 词法分析 ---------- */
// 支持科学计数法：1e5 / 2.5E-3
var NUM_RE = /^(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?/;

function normalize(src) {
  return String(src)
    .replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-')
    .replace(/[（]/g, '(').replace(/[）]/g, ')')
    .replace(/[，,]/g, '')
    .replace(/\s+/g, '')
    // 根号没有"函数名"形式，统一转成函数调用（√9 → sqrt(9)、√9+1 → sqrt(9)+1）
    .replace(/[√∛]\s*\(/g, function (m) { return m.indexOf('∛') >= 0 ? 'cbrt(' : 'sqrt('; })
    .replace(/√\s*([0-9.]+)/g, 'sqrt($1)')
    .replace(/∛\s*([0-9.]+)/g, 'cbrt($1)');
}
function tokenize(src) {
  var s = normalize(src);
  var out = [], i = 0;
  while (i < s.length) {
    var c = s[i];

    if (c >= '0' && c <= '9' || c === '.') {
      var m = s.slice(i).match(NUM_RE);
      if (!m) throw new Error('无法识别的数字');
      out.push({ t: 'num', v: parseFloat(m[0]) });
      i += m[0].length;
      continue;
    }
    if (c === 'π') { out.push({ t: 'num', v: CONSTS['π'] }); i++; continue; }
    if ('+-*/%^!()²³'.indexOf(c) !== -1) { out.push({ t: 'op', v: c }); i++; continue; }

    if (/[A-Za-z_]/.test(c)) {
      var j = i;
      while (j < s.length && /[A-Za-z0-9_]/.test(s[j])) j++;
      var raw = s.slice(i, j), low = raw.toLowerCase();
      if (low === 'ans') { out.push({ t: 'num', v: ANS }); i = j; continue; }
      if (Object.prototype.hasOwnProperty.call(CONSTS, low)) { out.push({ t: 'num', v: CONSTS[low] }); i = j; continue; }
      if (Object.prototype.hasOwnProperty.call(FUNCS, low)) { out.push({ t: 'func', v: low }); i = j; continue; }
      if (low === 'mod') { out.push({ t: 'op', v: '%' }); i = j; continue; }
      throw new Error('未知的名称「' + raw + '」');
    }
    throw new Error('无法识别的字符「' + c + '」');
  }
  return out;
}

/* ---------- 语法分析 + 求值 ---------- */
function evaluate(src) {
  var tk = tokenize(src), p = 0;

  function peek() { return tk[p]; }
  function next() { return tk[p++]; }
  function isOp(v) { var x = peek(); return x && x.t === 'op' && x.v === v; }

  function parseExpr() {
    var v = parseTerm();
    while (true) {
      if (isOp('+')) { next(); v += parseTerm(); }
      else if (isOp('-')) { next(); v -= parseTerm(); }
      else break;
    }
    return v;
  }
  function parseTerm() {
    var v = parseUnary();
    while (true) {
      if (isOp('*')) { next(); v *= parseUnary(); }
      else if (isOp('/')) {
        next();
        var d = parseUnary();
        if (d === 0) throw new Error('除数不能为 0');
        v /= d;
      }
      else if (isOp('%')) {
        next();
        var m = parseUnary();
        if (m === 0) throw new Error('取模的除数不能为 0');
        v = v % m;
      }
      else break;
    }
    return v;
  }
  function parseUnary() {
    if (isOp('-')) { next(); return -parseUnary(); }
    if (isOp('+')) { next(); return parseUnary(); }
    return parsePower();
  }
  function parsePower() {
    var base = parsePostfix();
    if (isOp('^')) {
      next();
      var ex = parseUnary();               // 右结合
      var r = Math.pow(base, ex);
      if (!isFinite(r) && isFinite(base) && isFinite(ex)) throw new Error('结果超出可表示范围');
      return r;
    }
    return base;
  }
  function parsePostfix() {
    var v = parsePrimary();
    while (true) {
      if (isOp('²')) { next(); v = v * v; }
      else if (isOp('³')) { next(); v = v * v * v; }
      else if (isOp('!')) {
        next();
        if (isOp('!')) { next(); v = doubleFactorial(v); }   // 双阶乘 5!! = 5×3×1
        else v = factorial(v);
      }
      else break;
    }
    return v;
  }
  function parsePrimary() {
    var t = peek();
    if (!t) throw new Error('表达式不完整');
    if (t.t === 'num') { next(); return t.v; }
    if (t.t === 'func') {
      next();
      var name = t.v;
      if (!isOp('(')) throw new Error('函数 ' + name + ' 后面要跟括号，例如 ' + name + '(30)');
      next();
      var arg = parseExpr();
      if (!isOp(')')) throw new Error('缺少右括号');
      next();
      var f = FUNCS[name].fn(arg);
      if (typeof f !== 'number' || isNaN(f)) throw new Error(name + '(' + trim(arg) + ') 无定义');
      return f;
    }
    if (isOp('(')) {
      next();
      var v = parseExpr();
      if (!isOp(')')) throw new Error('缺少右括号');
      next();
      return v;
    }
    throw new Error('表达式有误：多出一个「' + (t.v === undefined ? '符号' : t.v) + '」');
  }

  var value = parseExpr();
  if (p < tk.length) throw new Error('表达式有误：多余的内容');
  if (typeof value !== 'number' || isNaN(value)) throw new Error('结果无定义');
  if (!isFinite(value)) throw new Error('结果超出可表示范围');
  return value;
}

function factorial(n) {
  if (n < 0) throw new Error('负数没有阶乘');
  if (Math.abs(n - Math.round(n)) > 1e-9) throw new Error('阶乘只支持整数');
  n = Math.round(n);
  if (n > 170) throw new Error('阶乘过大（上限 170!）');
  var r = 1;
  for (var i = 2; i <= n; i++) r *= i;
  return r;
}
/** 双阶乘：跳过 2 步相乘，末尾视为 (-1)!! = 0!! = 1 */
function doubleFactorial(n) {
  if (n < 0) throw new Error('负数没有双阶乘');
  if (Math.abs(n - Math.round(n)) > 1e-9) throw new Error('双阶乘只支持整数');
  n = Math.round(n);
  if (n > 300) throw new Error('双阶乘过大（上限 300!!）');
  var r = 1;
  for (var i = n; i > 1; i -= 2) r *= i;
  return r;
}

/* ---------- 数字格式化：消除浮点误差 ---------- */
function trim(n) {
  if (typeof n !== 'number' || !isFinite(n)) return String(n);
  if (Number.isInteger(n) && Math.abs(n) < 1e15) return String(n);
  var r = parseFloat(n.toPrecision(12));
  return String(r);
}
function pretty(n) {
  if (typeof n !== 'number' || isNaN(n)) return '—';
  if (!isFinite(n)) return n > 0 ? '∞' : '-∞';
  var abs = Math.abs(n);
  if (abs !== 0 && (abs >= 1e15 || abs < 1e-9)) return n.toExponential(8).replace(/e([+-])(\d)$/, 'e$10$2');
  var s = parseFloat(n.toPrecision(12));
  var out = String(s);
  // 千分位（仅整数部分且长度适中时）
  var mm = out.match(/^(-?)(\d+)(\.\d+)?$/);
  if (mm && mm[2].length > 4) {
    out = mm[1] + mm[2].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (mm[3] || '');
  }
  return out;
}

/* ==================================================================
   界面
   ================================================================== */
var exprEl = $('expr'), resEl = $('result');
var history = load(KEY.hist, []);
if (!Array.isArray(history)) history = [];
var P = Object.assign({ theme: 'auto', angle: 'deg' }, load(KEY.prefs, {}));
angleMode = P.angle === 'rad' ? 'rad' : 'deg';

/* ---------- 主题 ---------- */
function themeNow() {
  if (P.theme === 'auto') {
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  return P.theme;
}
function applyTheme() {
  document.documentElement.setAttribute('data-theme', themeNow());
  $('themeBtn').textContent = themeNow() === 'dark' ? '☀️' : '🌙';
}
$('themeBtn').addEventListener('click', function () {
  P.theme = themeNow() === 'dark' ? 'light' : 'dark';
  store(KEY.prefs, P); applyTheme();
});

/* ---------- 角度制 ---------- */
function applyAngle() {
  $('chipAngle').textContent = angleMode === 'deg' ? 'DEG' : 'RAD';
  Array.prototype.forEach.call($('angleToggle').children, function (b) {
    b.classList.toggle('on', b.dataset.ang === angleMode);
  });
}
$('angleToggle').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-ang]');
  if (!b) return;
  angleMode = b.dataset.ang;
  P.angle = angleMode; store(KEY.prefs, P);
  applyAngle(); liveEval();
});

/* ---------- 内存 ---------- */
var mem = 0, memUsed = false;
function applyMem() {
  $('chipMem').classList.toggle('on', memUsed);
  $('chipMem').textContent = memUsed ? ('M ' + pretty(mem)) : 'M';
}
function insertAtCursor(text) {
  var s = exprEl.selectionStart, e = exprEl.selectionEnd;
  var v = exprEl.value;
  if (s == null) { s = e = v.length; }
  exprEl.value = v.slice(0, s) + text + v.slice(e);
  var pos = s + text.length;
  exprEl.setSelectionRange(pos, pos);
  exprEl.focus();
  liveEval();
}

/* ---------- 实时求值 ---------- */
function liveEval() {
  var v = exprEl.value.trim();
  if (!v) { resEl.textContent = '0'; resEl.className = ''; return null; }
  try {
    var out = evaluate(v);
    resEl.textContent = '= ' + pretty(out);
    resEl.className = 'ok';
    return out;
  } catch (err) {
    resEl.textContent = '…';
    resEl.className = '';
    return null;
  }
}

/* ---------- 求值 ---------- */
function commit() {
  var v = exprEl.value.trim();
  if (!v) return;
  var out;
  try {
    out = evaluate(v);
  } catch (err) {
    resEl.textContent = err.message;
    resEl.className = 'err';
    toast('无法计算：' + err.message);
    return;
  }
  var shown = pretty(out);
  resEl.textContent = '= ' + shown;
  resEl.className = 'ok';
  ANS = out;
  $('chipAns').textContent = 'Ans = ' + shown;

  history.unshift({ e: v, r: shown, t: Date.now() });
  if (history.length > MAX_HIST) history = history.slice(0, MAX_HIST);
  store(KEY.hist, history);
  renderHistory();

  exprEl.value = shown.replace(/,/g, '');
  exprEl.setSelectionRange(exprEl.value.length, exprEl.value.length);
}

/* ---------- 历史 ---------- */
function renderHistory() {
  var host = $('histList');
  host.innerHTML = '';
  if (!history.length) {
    var e = document.createElement('div');
    e.className = 'empty';
    var b = document.createElement('div'); b.className = 'big'; b.textContent = '🕘';
    e.appendChild(b);
    e.appendChild(document.createTextNode('还没有计算记录'));
    host.appendChild(e);
    return;
  }
  history.forEach(function (h) {
    var it = document.createElement('div');
    it.className = 'hist-item';
    it.title = '点击把结果放回输入框';
    var a = document.createElement('div'); a.className = 'e'; a.textContent = h.e;
    var c = document.createElement('div'); c.className = 'r'; c.textContent = '= ' + h.r;
    it.appendChild(a); it.appendChild(c);
    it.addEventListener('click', function () {
      exprEl.value = String(h.r).replace(/,/g, '');
      exprEl.setSelectionRange(exprEl.value.length, exprEl.value.length);
      exprEl.focus(); liveEval();
    });
    host.appendChild(it);
  });
}
$('histClear').addEventListener('click', function () {
  if (!history.length) return;
  if (!confirm('清空全部历史记录？')) return;
  history = []; store(KEY.hist, history); renderHistory();
  toast('历史已清空');
});

/* ---------- 2nd 功能 ---------- */
var second = false;
var FN2_LABEL = { asin: 'sin⁻¹', acos: 'cos⁻¹', atan: 'tan⁻¹', pow10: '10ˣ', exp: 'eˣ', cbrt: '∛' };
function applySecond() {
  $('btn2nd').classList.toggle('on', second);
  Array.prototype.forEach.call(document.querySelectorAll('.key[data-fn]'), function (b) {
    var name = second ? b.dataset.fn2 : b.dataset.fn;
    b.textContent = second ? (FN2_LABEL[name] || name) : defaultLabel(b.dataset.fn);
  });
}
function defaultLabel(fn) {
  switch (fn) {
    case 'sqrt': return '√';
    default: return fn;
  }
}

/* ==================================================================
   按键分发
   ================================================================== */
$('pad').addEventListener('click', function (e) {
  var k = e.target.closest('.key');
  if (!k) return;
  var act = k.dataset.act;

  if (act === '2nd') { second = !second; applySecond(); return; }
  if (act === 'pi') { insertAtCursor('π'); return; }
  if (act === 'e')  { insertAtCursor('e'); return; }
  if (act === 'rand') { insertAtCursor(trim(Math.random())); return; }
  if (act === 'ans') { insertAtCursor('Ans'); return; }
  if (act === 'eq') { commit(); return; }
  if (act === 'clr') {
    if (k.dataset.clr === 'all') {
      exprEl.value = ''; resEl.textContent = '0'; resEl.className = '';
    } else {
      var s = exprEl.selectionStart, en = exprEl.selectionEnd, v = exprEl.value;
      if (s === en && s > 0) {
        exprEl.value = v.slice(0, s - 1) + v.slice(en);
        exprEl.setSelectionRange(s - 1, s - 1);
      } else if (s !== en) {
        exprEl.value = v.slice(0, s) + v.slice(en);
        exprEl.setSelectionRange(s, s);
      }
    }
    exprEl.focus(); liveEval(); return;
  }
  if (act === 'sign') {
    var cur = exprEl.value;
    if (/^-/.test(cur)) exprEl.value = cur.slice(1);
    else exprEl.value = '-' + cur;
    exprEl.setSelectionRange(exprEl.value.length, exprEl.value.length);
    exprEl.focus(); liveEval(); return;
  }
  if (act === 'fn') {
    var fn = second ? k.dataset.fn2 : k.dataset.fn;
    if (fn === 'sqrt')   { insertAtCursor('√('); return; }
    if (fn === 'cbrt')   { insertAtCursor('cbrt('); return; }
    if (fn === 'pow10')  { insertAtCursor('pow10('); return; }
    insertAtCursor(fn + '(');
    return;
  }
  if (act === 'mem') {
    var m = k.dataset.mem;
    var cur = null;
    try { cur = evaluate(exprEl.value || '0'); } catch (err) { cur = null; }
    if (m === 'mc') { mem = 0; memUsed = false; toast('内存已清除'); }
    else if (m === 'mr') { if (!memUsed) { toast('内存为空'); } else insertAtCursor(trim(mem)); }
    else if (m === 'm+') {
      if (cur == null) { toast('当前表达式无法求值'); return; }
      mem += cur; memUsed = true; toast('M+ = ' + pretty(mem));
    }
    else if (m === 'm-') {
      if (cur == null) { toast('当前表达式无法求值'); return; }
      mem -= cur; memUsed = true; toast('M− = ' + pretty(mem));
    }
    applyMem(); return;
  }
  if (k.dataset.ins) { insertAtCursor(k.dataset.ins); return; }
});

/* ==================================================================
   键盘
   ================================================================== */
var histPtr = -1;
exprEl.addEventListener('input', liveEval);
exprEl.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); commit(); histPtr = -1; return; }
  if (e.key === 'Escape') {
    e.preventDefault();
    exprEl.value = ''; resEl.textContent = '0'; resEl.className = '';
    histPtr = -1; return;
  }
  if (e.key === 'ArrowUp') {
    if (!history.length) return;
    e.preventDefault();
    histPtr = Math.min(histPtr + 1, history.length - 1);
    exprEl.value = history[histPtr].e;
    exprEl.setSelectionRange(exprEl.value.length, exprEl.value.length);
    liveEval(); return;
  }
  if (e.key === 'ArrowDown') {
    if (histPtr < 0) return;
    e.preventDefault();
    histPtr -= 1;
    if (histPtr < 0) { exprEl.value = ''; }
    else { exprEl.value = history[histPtr].e; }
    exprEl.setSelectionRange(exprEl.value.length, exprEl.value.length);
    liveEval(); return;
  }
});

/* 全局快捷键：非输入态时也能直接用 */
document.addEventListener('keydown', function (e) {
  if (e.target === exprEl) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[0-9.]$/.test(e.key) || '+-*/^()!%'.indexOf(e.key) !== -1) {
    exprEl.focus();
    insertAtCursor(e.key === '*' ? '×' : e.key === '/' ? '÷' : e.key);
    e.preventDefault();
  } else if (e.key === 'Enter') {
    e.preventDefault(); commit();
  } else if (e.key === 'Backspace') {
    exprEl.focus();
    var s = exprEl.selectionStart, v = exprEl.value;
    if (s > 0) { exprEl.value = v.slice(0, s - 1) + v.slice(s); exprEl.setSelectionRange(s - 1, s - 1); }
    liveEval(); e.preventDefault();
  }
});

/* ==================================================================
   启动
   ================================================================== */
function boot() {
  applyTheme();
  applyAngle();
  applyMem();
  applySecond();
  renderHistory();

  if (history.length) {
    ANS = 0;
    var lastNum = parseFloat(String(history[0].r).replace(/,/g, ''));
    if (isFinite(lastNum)) { ANS = lastNum; $('chipAns').textContent = 'Ans = ' + history[0].r; }
  }
  exprEl.focus();
  $('subTitle').textContent = history.length
    ? ('已保存 ' + history.length + ' 条历史记录')
    : '支持表达式、历史记录与内存';
}

try { boot(); }
catch (err) {
  console.error(err);
  document.body.insertAdjacentHTML('beforeend',
    '<div style="position:fixed;left:0;right:0;bottom:0;background:#e5484d;color:#fff;' +
    'padding:11px 15px;font-size:13px;z-index:99">计算器启动出错：' + err.message + '</div>');
}
})();
</script>
</body>
</html>
